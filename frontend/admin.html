<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brightside Dental — Reservations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="brand"><span>Brightside Dental</span></a>
      <a href="index.html" class="btn btn-ghost btn-small">Patient site</a>
    </div>
  </header>

  <main class="admin-page">
    <div class="wrap">
      <p class="eyebrow">Front desk</p>
      <h1>Reservations</h1>
      <p class="section-sub">Enter the admin key to view current and cancelled bookings.</p>

      <form id="adminLoginForm" class="admin-login-form">
        <label for="adminKey">Admin key</label>
        <div class="admin-key-row">
          <input id="adminKey" type="password" autocomplete="current-password" required placeholder="Enter admin key" />
          <button type="submit" class="btn btn-primary">View reservations</button>
        </div>
        <p id="adminError" class="admin-error" role="alert"></p>
      </form>

      <section id="reservationsPanel" hidden aria-live="polite">
        <div class="admin-toolbar">
          <p id="reservationCount" class="admin-count"></p>
          <button type="button" id="refreshBtn" class="btn btn-ghost btn-small">Refresh</button>
        </div>
        <div class="table-wrap">
          <table class="reservations-table">
            <thead>
              <tr><th>Date &amp; time</th><th>Patient</th><th>Contact</th><th>Service</th><th>Dentist</th><th>Notes</th><th>Status</th></tr>
            </thead>
            <tbody id="reservationsBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
